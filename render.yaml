# Render Blueprint — "Fozilovlar" taklifnoma platformasi (wedding-master/).
# Dashboard → New → Blueprint → shu repo. MONGODB_URI so'raladi (MongoDB Atlas).
# Sayt domen ildizida ishlaydi: https://beluga.uz/<havola> (Render: wedding-we9g.onrender.com).
# Ichki yo'lda kerak bo'lsa BASE_PATH (masalan /erbotayev) qo'shiladi.
services:
  - type: web
    name: wedding
    runtime: node
    plan: free
    region: frankfurt
    rootDir: wedding-master
    # NODE_ENV=production devDependencies'ni o'tkazib yuboradi, build uchun esa
    # typescript va vite kerak
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    domains:
      - beluga.uz
      - www.beluga.uz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      # /admin paneliga kira oladigan email'lar (vergul bilan) — dashboard'da kiritiladi
      - key: ADMIN_EMAILS
        sync: false
      # Nashrni Telegram orqali tasdiqlash — dashboard'da kiritiladi
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_ADMIN_CHAT_ID
        sync: false
      - key: TG_BOT_USERNAME
        value: ukamheppy_bot
      - key: TG_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_URL
        value: https://beluga.uz
      # To'lov: karta raqami botda ko'rsatiladi, chek shu kontaktga ham yuborilishi mumkin
      - key: PAYMENT_CARD
        sync: false
      - key: PAYMENT_CONTACT
        value: belugadotenv
